<table cellpadding="0">
  <tr>
    <td width="60mm"><img src="{{img.logo}}" height="15mm" /></td>
    <td width="110mm" align="right" style="font-size:8.5pt;color:#444444;"><br /><br />{{establishment.name}}</td>
  </tr>
</table>
<!--@body-->
<div style="text-align:center;font-size:15pt;font-weight:bold;">Liste du corps enseignant</div>

<br />
{{^hasmembers}}<p>Aucun enseignant actif de l’établissement dans l’annuaire.</p>{{/hasmembers}}

{{#members}}  <tr nobr="true"><td width="170mm">{{name}}</td></tr>
{{/members}}</table>
<br />
{{/groups}}
<!--@footer-->
<div style="font-size:8pt;text-align:right;color:#444444;">Page {{pagenumber}} / {{pagecount}}</div>
