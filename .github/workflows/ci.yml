name: CI

# Les étiquettes vX.Y.Z sont créées par le job « Publication » (jeton du dépôt, qui ne déclenche
# aucune exécution) : rien ne s'exécute sur étiquette.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une poussée sur une demande de fusion annule l'exécution précédente ; sur main, chaque exécution va
# à son terme (la publication ne doit pas être interrompue).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    name: Style Moodle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Install Moodle coding standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction "moodlehq/moodle-cs:^3.7"
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Run phpcs
        run: phpcs --standard=phpcs.xml -p

      - name: Portabilité musl (pas de GLOB_BRACE)
        # GLOB_BRACE n'existe pas dans les PHP compilés avec musl (Alpine) : « Undefined constant ».
        # Dernière commande de l'étape : son code de retour est celui de l'étape.
        run: |
          ! grep -rn "GLOB_BRACE" mod --include='*.php'

  moodle:
    # Les deux versions LTS encore suivies, avec la plus ancienne version de PHP que chacune accepte
    # (la couverture est mesurée sur la seconde), et la version majeure courante avec PHP 8.3.
    # $plugin->requires annonce Moodle 4.0, qui n'est pas testé.
    name: Moodle ${{ matrix.moodle }} · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_401_STABLE
            php: "8.0"
            database: mariadb
            coverage: none
          - moodle: MOODLE_405_STABLE
            php: "8.2"
            database: pgsql
            coverage: pcov
          - moodle: MOODLE_500_STABLE
            php: "8.3"
            database: pgsql
            coverage: none

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, pdo_pgsql, gd, intl, mbstring, soap, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          tools: composer
          coverage: ${{ matrix.coverage }}

      - name: Install moodle-plugin-ci
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "${GITHUB_WORKSPACE}/ci/bin" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/ci/vendor/bin" >> "$GITHUB_PATH"
          echo "NVM_DIR=${HOME}/.nvm" >> "$GITHUB_ENV"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle
        id: moodle_install
        env:
          DB: ${{ matrix.database }}
        run: |
          mkdir -p ci-extra-plugins
          cp -R mod/thesesynthesis ci-extra-plugins/thesesynthesis
          if [ "$DB" = "pgsql" ]; then dbuser=postgres; else dbuser=root; fi
          moodle-plugin-ci install \
            --moodle=moodle \
            --branch=${{ matrix.moodle }} \
            --db-type="$DB" \
            --db-host=127.0.0.1 \
            --db-name=moodle \
            --db-user="$dbuser" \
            --plugin=mod/these \
            --extra-plugins=ci-extra-plugins

      - name: PHP lint
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        run: |
          check_status=0
          moodle-plugin-ci phplint mod/these || check_status=1
          moodle-plugin-ci phplint mod/thesesynthesis || check_status=1
          exit "$check_status"

      - name: Plugin validation
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        run: |
          check_status=0
          moodle-plugin-ci validate mod/these || check_status=1
          moodle-plugin-ci validate mod/thesesynthesis || check_status=1
          exit "$check_status"

      - name: Upgrade savepoints
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        run: |
          check_status=0
          moodle-plugin-ci savepoints mod/these || check_status=1
          moodle-plugin-ci savepoints mod/thesesynthesis || check_status=1
          exit "$check_status"

      - name: PHPDoc
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        run: |
          check_status=0
          moodle-plugin-ci phpdoc --max-warnings=0 mod/these || check_status=1
          moodle-plugin-ci phpdoc --max-warnings=0 mod/thesesynthesis || check_status=1
          exit "$check_status"

      - name: Mustache templates
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        # Le contrôle des gabarits exige un chemin dans le Moodle installé : les copies de moodle/mod/.
        run: |
          check_status=0
          moodle-plugin-ci mustache moodle/mod/these || check_status=1
          moodle-plugin-ci mustache moodle/mod/thesesynthesis || check_status=1
          exit "$check_status"

      - name: PHPUnit
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          # Couverture des tests mesurée sur une seule configuration (pcov) : affichée dans le journal
          # et conservée au format Clover (moodle-plugin-ci écrit coverage.xml dans le répertoire
          # courant, un fichier par module) pour l'artefact « coverage ».
          options=""
          if [ "$COVERAGE" = "pcov" ]; then options="--coverage-text --coverage-clover"; mkdir -p coverage; fi
          check_status=0
          for plugin in these thesesynthesis; do
            moodle-plugin-ci phpunit $options "mod/$plugin" || check_status=1
            if [ -f coverage.xml ]; then mv coverage.xml "coverage/$plugin.xml"; fi
          done
          exit "$check_status"

      - name: Upload coverage
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' && matrix.coverage == 'pcov' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Behat
        if: ${{ !cancelled() && steps.moodle_install.outcome == 'success' }}
        # Chaque lancement démarre un conteneur Selenium nommé « selenium » : celui du premier module
        # est retiré avant le second, qui sinon peut échouer sur un conflit de nom.
        run: |
          check_status=0
          moodle-plugin-ci behat --profile chrome mod/these || check_status=1
          docker rm -f selenium > /dev/null 2>&1 || true
          moodle-plugin-ci behat --profile chrome mod/thesesynthesis || check_status=1
          exit "$check_status"

  guide:
    # Le guide PDF n'est plus versionné : il est produit ici depuis son source LaTeX et conservé comme
    # artefact de chaque exécution ; le job « Publication » le joint à la publication d'une version.
    name: Guide PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-lang-french texlive-pictures lmodern

      - name: Build guide
        working-directory: docs/guides
        run: |
          for pass in 1 2; do
            pdflatex -interaction=nonstopmode -halt-on-error guide-these.tex > /dev/null \
              || { tail -n 40 guide-these.log; exit 1; }
          done

      - name: Upload guide
        uses: actions/upload-artifact@v4
        with:
          name: guide-these
          path: docs/guides/guide-these.pdf

  release:
    # Publication automatique : sur main, une fois tous les contrôles verts, la version de mod_these
    # (release de version.php) qui n'a pas encore d'étiquette est étiquetée vX.Y.Z et publiée, avec la
    # première section de CHANGES.md pour notes et le guide PDF produit par le job « guide ».
    name: Publication
    needs: [style, moodle, guide]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          release=$(sed -nE "s/^\\\$plugin->release *= *'([^']+)';.*/\1/p" mod/these/version.php)
          if [ -z "$release" ]; then echo "release introuvable dans mod/these/version.php"; exit 1; fi
          # Les notes de publication sont la première section de CHANGES.md : elle doit être celle de
          # la version publiée, sinon la publication s'arrête ici.
          heading=$(grep -m 1 '^## ' CHANGES.md)
          if ! printf '%s\n' "$heading" | grep -qwF "$release"; then
            echo "::error file=CHANGES.md::La première section de CHANGES.md (« $heading ») ne mentionne pas" \
              "la version $release de mod/these/version.php : ajouter la section de la version avant de publier."
            exit 1
          fi
          echo "tag=v$release" >> "$GITHUB_OUTPUT"

      - name: Download guide
        uses: actions/download-artifact@v4
        with:
          name: guide-these
          path: guide

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG est déjà publiée."
            exit 0
          fi
          awk '/^## /{n++} n==1' CHANGES.md > notes.md
          printf '\nHistorique complet : CHANGES.md.\n' >> notes.md
          gh release create "$TAG" guide/guide-these.pdf --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md
